

{% extends 'accounts/base.html' %}

{% block title %}Register | Custom Auth{% endblock %}

{% block content %}

<div class="min-h-[65vh] flex items-center justify-center">

    <div class="w-full max-w-md bg-white border border-gray-200 rounded-2xl p-8 shadow-sm">

        <!-- Heading -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">
                Create an account
            </h1>
            <p class="text-sm text-gray-500 mt-2">
                Get started by creating your account.
            </p>
        </div>

        <!-- Register Form -->
        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <!-- Username -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Username
                </label>
                <input
                    type="text"
                    name="name"
                    placeholder="Enter your username"
                    required
                    autocomplete="name"
                    class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm outline-none focus:border-gray-900 focus:ring-2 focus:ring-gray-100 transition"
                >
            </div>

            <!-- Email -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Email Address
                </label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                    class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm outline-none focus:border-gray-900 focus:ring-2 focus:ring-gray-100 transition"
                >
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Password
                </label>
                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                    autocomplete="new-password"
                    class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm outline-none focus:border-gray-900 focus:ring-2 focus:ring-gray-100 transition"
                >
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Confirm Password
                </label>
                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                    autocomplete="new-password"
                    class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm outline-none focus:border-gray-900 focus:ring-2 focus:ring-gray-100 transition"
                >
            </div>

            <!-- Submit -->
            <button
                type="submit"
                class="w-full py-3 bg-gray-900 text-white text-sm font-semibold rounded-lg hover:bg-gray-700 transition">
                Create Account
            </button>

        </form>

        <!-- Login Link -->
        <div class="mt-7 text-center">
            <p class="text-sm text-gray-500">
                Already have an account?

                <a href="{% url 'login' %}"
                   class="font-semibold text-gray-900 hover:underline">
                    Sign in
                </a>
            </p>
        </div>

    </div>

</div>

{% endblock %}
