{% extends 'accounts/base.html' %}

{% block title %}Login | Custom Auth{% endblock %}

{% block content %}

<div class="min-h-[65vh] flex items-center justify-center">

    <div class="w-full max-w-md bg-white border border-gray-200 rounded-2xl p-8 shadow-sm">

        <!-- Heading -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">
                Welcome back
            </h1>
            <p class="text-sm text-gray-500 mt-2">
                Sign in to continue to your account.
            </p>
        </div>

        <!-- Login Form -->
        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <!-- Email -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                    autocomplete="email"
                    class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm outline-none focus:border-gray-900 focus:ring-2 focus:ring-gray-100 transition"
                >
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                    class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm outline-none focus:border-gray-900 focus:ring-2 focus:ring-gray-100 transition"
                >

                <!-- Forgot Password -->
                <div class="flex justify-end mt-2">
                    <a href="{% url 'password_forgot' %}"
                       class="text-sm font-medium text-gray-500 hover:text-gray-900 transition">
                        Forgot Password?
                    </a>
                </div>
            </div>

            <!-- Login Button -->
            <button
                type="submit"
                class="w-full py-3 bg-gray-900 text-white text-sm font-semibold rounded-lg hover:bg-gray-700 transition">
                Sign In
            </button>

        </form>

        <!-- OR Divider -->
        <div class="flex items-center gap-4 my-7">
            <div class="flex-1 h-px bg-gray-200"></div>
            <span class="text-xs font-medium text-gray-400 uppercase">
                Or
            </span>
            <div class="flex-1 h-px bg-gray-200"></div>
        </div>

        <!-- Register Button -->
        <a href="{% url 'register' %}"
           class="block w-full text-center py-3 border border-gray-200 text-gray-800 text-sm font-semibold rounded-lg hover:bg-gray-50 hover:border-gray-300 transition">
            Create an Account
        </a>

        <!-- Footer Text -->
        <p class="text-center text-xs text-gray-400 mt-6">
            Secure authentication powered by Django.
        </p>

    </div>

</div>

{% endblock %}
